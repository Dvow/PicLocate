name: Windows C++ build
on:
  workflow_call:
    inputs:
      update_repository:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/PicLocateBuild/cache
          key: piclocate-windows-${{ matrix.arch }}-${{ hashFiles('cmake/**', 'scripts/*.json') }}
      - name: Build, test and package
        shell: pwsh
        env:
          UPDATE_REPOSITORY: ${{ inputs.update_repository }}
        run: ./scripts/build.ps1 -Architecture ${{ matrix.arch }} -BuildDirectory .build/ci-release -PackageDirectory dist/PicLocate-Windows -UpdateRepository $env:UPDATE_REPOSITORY
      - name: Verify deployed package
        shell: pwsh
        run: python scripts/test-package.py dist/PicLocate-Windows/PicLocate.exe --output .build/package-test --screenshot
      - name: Verify installer lifecycle
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installers/PicLocate-*-Setup-${{ matrix.arch }}.exe | Select-Object -First 1
          $qt = (Select-String -LiteralPath .build/ci-release/CMakeCache.txt -Pattern '^PICLOCATE_QT_ROOT:PATH=').Line.Split('=',2)[1]
          ./scripts/test-installer.ps1 -Installer $setup.FullName -PayloadDirectory .build/ci-release/installer-stage -OffscreenPlugin "$qt/plugins/platforms/qoffscreen.dll" -TestDirectory "$env:RUNNER_TEMP/PicLocate installer verification"
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PicLocate-windows-${{ matrix.arch }}-test-results
          path: |
            .build/ci-release/*-test-results.txt
            .build/package-test/*.json
            .build/package-test/*.log
            .build/package-test/*.png
      - name: Keep installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PicLocate-windows-${{ matrix.arch }}-installer-test-results
          path: |
            ${{ runner.temp }}/PicLocate installer verification/*.log
            ${{ runner.temp }}/PicLocate installer verification/*.json
      - name: Archive portable package
        shell: pwsh
        run: |
          $version = python scripts/release.py --version
          python -m zipfile -c "dist/installers/PicLocate-$version-windows-${{ matrix.arch }}.zip" dist/PicLocate-Windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/installers/*.exe
            dist/installers/*.zip
