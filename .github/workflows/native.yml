name: Native desktop builds
on:
  workflow_call:
    inputs:
      update_repository:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      PICLOCATE_DEPENDENCY_CACHE: ${{ github.workspace }}/.cache/dependencies
      PICLOCATE_PACKAGE_DIR: ${{ github.workspace }}/dist/PicLocate
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dependencies
          key: piclocate-${{ matrix.target }}-${{ hashFiles('cmake/**', 'scripts/*.json') }}
      - name: Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-util1 libdbus-1-3 xvfb xauth patchelf
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: Build, test and package
        env:
          UPDATE_REPOSITORY: ${{ inputs.update_repository }}
        run: bash scripts/build.sh -DPICLOCATE_DEPENDENCY_CACHE="$PICLOCATE_DEPENDENCY_CACHE" -DPICLOCATE_UPDATE_REPOSITORY="$UPDATE_REPOSITORY"
      - name: Verify package replacement and restart
        run: python3 scripts/test-update.py
      - name: Linux deployed package checks
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=xcb xvfb-run -a python3 scripts/test-package.py dist/PicLocate/bin/PicLocate --output .build/package-test --screenshot
      - name: macOS deployed package checks
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=cocoa python3 scripts/test-package.py dist/PicLocate/PicLocate.app/Contents/MacOS/PicLocate --output .build/package-test --screenshot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: PicLocate-${{ matrix.target }}-test-results
          path: |
            .build/native-release/*-test-results.txt
            .build/native-release/Testing/Temporary/LastTest.log
            .build/package-test/*.json
            .build/package-test/*.log
            .build/package-test/*.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: dist/packages/PicLocate-*
